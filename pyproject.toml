[project]
name = "linkml-arrays"
description = "linkml-arrays"
authors = [
    { name = "Ryan Ly", email = "rly@lbl.gov" },
    { name = "Chris Mungall", email = "cjmungall@lbl.gov" },
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "linkml-runtime>=1.8.0",
    "linkml",
    "numpy>=1.24.3",
    "h5py>=3.9.0",
    "zarr>=3.1.0",
    "xarray>=2025.3",
    "ruamel-yaml>=0.18.6,<0.19",
    "importlib_metadata",
    "h5netcdf>=1.8.1",
]

[dependency-groups]
dev = [
    "pytest",
    "tox",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "sphinx-click",
    "myst-parser"
]
jupyter = [
    "jupyter"
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
reverse_relative = true
